<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeChat-Echo</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --secondary: #86868b;
    --tertiary: #aeaeb2;
    --border: #e8e8ed;
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,.06), 0 0 0 .5px rgba(0,0,0,.04);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --transition: .18s cubic-bezier(.25,.1,.25,1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }

  /* title bar ————————————————————— */
  .titlebar {
    display: flex; align-items: center;
    padding: 6px 10px;
    background: var(--bg);
    user-select: none;
  }
  .titlebar-drag-area { flex: 1; height: 28px; }
  .titlebar-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    cursor: pointer; background: none; color: var(--tertiary);
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition); flex-shrink: 0;
  }
  .titlebar-btn img, .titlebar-close img { width: 14px; height: 14px; object-fit: contain; }
  .titlebar-btn:hover, .titlebar-close:hover { background: rgba(0,0,0,.06); }
  .titlebar-close {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    cursor: pointer; background: none; color: var(--tertiary);
    display: flex; align-items: center; justify-content: center;
    transition: var(--transition); flex-shrink: 0;
  }
  .titlebar-close:hover { background: rgba(0,0,0,.06); }

  /* header —————————————————————————— */
  .header {
    padding: 12px 28px 12px;
    display: flex; align-items: center; gap: 16px;
    background: var(--bg);
    z-index: 10;
  }
  .header-logo { height: 48px; width: auto; }

  /* main —————————————————————————— */
  .main {
    flex:1; overflow-y: auto;
    padding: 4px 28px 20px;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* empty ————————————————————————— */
  .empty-state {
    flex:1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 80px 20px; gap: 12px;
  }
  .empty-icon { width: 64px; height: 64px; opacity: .4; }
  .empty-title { font-size: 14px; font-weight: 600; color: var(--secondary); }
  .empty-desc { font-size: 13px; color: var(--tertiary); }

  /* card ————————————————————————— */
  .card {
    position: relative;
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow-sm);
    border: .5px solid transparent;
    transition: var(--transition);
  }
  .card:hover {
    box-shadow: var(--shadow-md);
    border-color: rgba(0,0,0,.06);
  }
  .card.online {
    border-left: 3px solid var(--green);
  }
  .card.launching {
    border-left: 3px solid var(--orange);
  }

  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .dot.online { background: var(--green); }
  .dot.offline { background: var(--tertiary); }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #f0f0f5;
    font-size: 18px; font-weight: 500; color: var(--secondary);
    letter-spacing: -.5px;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .info { flex:1; min-width: 0; }
  .info .title {
    font-size: 14px; font-weight: 600; letter-spacing: -.2px;
    display: flex; align-items: center; gap: 5px;
    cursor: default;
  }
  .info .title .edit-hint {
    opacity: 0; font-size: 11px; color: var(--accent);
    transition: var(--transition);
  }
  .card:hover .info .title .edit-hint { opacity: 1; }
  .info .sub {
    font-size: 12px; color: var(--secondary);
    margin-top: 2px; letter-spacing: -.1px;
  }

  .badge {
    font-size: 11px; padding: 3px 10px; border-radius: 100px;
    font-weight: 500; letter-spacing: -.1px; white-space: nowrap;
  }
  .badge-ok { background: #e8f8ed; color: #1a7d3e; }
  .badge-warn { background: #fff3e0; color: #b05d00; }

  .card-delete {
    position: absolute; top: -10px; right: -10px;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    cursor: pointer; background: none;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: var(--transition);
  }
  .card:hover .card-delete { opacity: 1; }
  .card-delete:hover { background: rgba(0,0,0,.06); }
  .card-delete img { width: 16px; height: 16px; object-fit: contain; opacity: .45; }
  .card-delete:hover img { opacity: .75; }

  .card-close {
    padding: 4px 12px; border-radius: 100px; border: none;
    font-size: 11px; font-weight: 500; cursor: pointer;
    font-family: inherit; letter-spacing: -.1px; flex-shrink: 0;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; margin-right: 8px;
    transition: all .2s ease;
  }
  .card-close:hover { opacity: .85; transform: translateY(-0.5px); }

  /* footer text buttons */
  .btn-text {
    padding: 8px 18px; border-radius: 100px; border: none;
    font-size: 13px; font-weight: 500; cursor: pointer;
    letter-spacing: -.2px; font-family: inherit;
    transition: var(--transition); background: none;
    color: var(--secondary);
  }
  .btn-text:hover { color: var(--text); background: rgba(0,0,0,.05); }
  .btn-text.primary { background: var(--accent); color: #fff; }
  .btn-text.primary:hover { background: var(--accent-hover); }

  /* login CTA */
  .btn-login {
    padding: 10px 28px; border-radius: 100px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; letter-spacing: -.2px;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.08);
    transition: all .25s cubic-bezier(.25,.1,.25,1);
  }
  .btn-login:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0,0,0,.16), 0 0 0 .5px rgba(0,0,0,.1);
  }
  .btn-login:active { transform: translateY(0); }
  .btn-login.info {
    background: var(--card); color: var(--text);
    box-shadow: var(--shadow-sm);
    border: .5px solid var(--border);
    cursor: default; pointer-events: none;
  }

  /* footer ——————————————————————— */
  .footer {
    padding: 14px 28px 18px;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg);
  }
  /* modal ——————————————————————— */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.28);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity .2s; backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--card); border-radius: var(--radius);
    padding: 28px; width: 420px; max-width: 90vw;
    box-shadow: 0 20px 60px rgba(0,0,0,.15), 0 0 0 .5px rgba(0,0,0,.08);
    display: flex; flex-direction: column; gap: 16px;
  }
  .modal h2 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
  .modal label { font-size: 12px; font-weight: 600; color: var(--secondary); text-transform: uppercase; letter-spacing: .5px; }
  .modal input, .modal select {
    width: 100%; padding: 10px 14px; border: none; border-radius: var(--radius-xs);
    font-size: 14px; outline: none; background: #f5f5f7; color: var(--text);
    font-family: inherit; transition: var(--transition);
  }
  .modal input:focus { background: #eeeef2; }
  .modal .row { display: flex; gap: 8px; align-items: center; }
  .modal .row input { flex:1; }
  .modal .path-display {
    flex:1; padding: 10px 14px; background: #f5f5f7;
    border-radius: var(--radius-xs); font-size: 12px;
    color: var(--secondary); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .modal .hint {
    font-size: 12px; color: var(--orange); line-height: 1.6;
    padding: 10px 14px; background: #fff9f0; border-radius: var(--radius-sm);
  }
  .modal .checkbox-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .modal .checkbox-row input { width: auto; }

  /* toast ——————————————————————— */
  .toast-container {
    position: fixed; top: 24px; right: 24px; z-index: 200;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    padding: 10px 18px; border-radius: 100px; font-size: 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    animation: slideIn .3s cubic-bezier(.25,.1,.25,1);
    font-weight: 500; letter-spacing: -.1px; backdrop-filter: blur(10px);
  }
  .toast.success { background: rgba(52,199,89,.92); color: #fff; }
  .toast.error { background: rgba(255,59,48,.92); color: #fff; }
  .toast.progress { background: rgba(28,28,30,.9); color: #fff; display: flex; align-items: center; gap: 10px; }
  .toast .progress-bar {
    width: 80px; height: 4px; background: rgba(255,255,255,.2);
    border-radius: 100px; overflow: hidden;
  }
  .toast .progress-bar-fill {
    height: 100%; background: var(--green);
    border-radius: 100px; transition: width .3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* login waiting overlay ————————————— */
  .login-overlay {
    position: fixed; inset: 0; background: rgba(245,245,247,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity .25s; backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .login-overlay.active { opacity: 1; pointer-events: auto; }
  .login-waiting {
    background: var(--card); border-radius: var(--radius);
    padding: 40px 48px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06);
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .login-waiting h2 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .login-waiting p { font-size: 13px; color: var(--secondary); line-height: 1.6; }
  .login-spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-cancel {
    padding: 8px 20px; border-radius: 100px; border: none;
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: inherit; letter-spacing: -.2px;
    background: none; color: var(--secondary);
    transition: var(--transition);
    margin-top: 8px;
  }
  .btn-cancel:hover { color: var(--red); background: rgba(255,59,48,.06); }

  /* scrollbar ——————————————————— */
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: #d5d5da; border-radius: 100px; }
  .main::-webkit-scrollbar-thumb:hover { background: #c5c5ca; }
</style>
</head>
<body>

<!-- title bar -->
<div class="titlebar">
  <span class="titlebar-drag-area"></span>
  <button class="titlebar-btn" title="最小化" onclick="api.minimize_window()">
    <img src="{{HIDE_ICON}}" alt="">
  </button>
  <button class="titlebar-btn" title="设置" onclick="openSettings()">
    <img src="{{SETTING_ICON}}" alt="">
  </button>
  <button class="titlebar-close" onclick="api.close_window()" title="关闭">
    <img src="{{CLOSE_ICON}}" alt="">
  </button>
</div>

<!-- header -->
<div class="header">
  <img class="header-logo" src="{{TITLE_LOGO}}" alt="WeChat-Echo">
</div>

<!-- list -->
<div class="main" id="accountList">
  <div class="empty-state">
    <img class="empty-icon" src="{{CHAT_ICON}}" alt="">
    <div class="empty-title">暂无账号</div>
    <div class="empty-desc">添加微信账号并备份凭证</div>
  </div>
</div>

<!-- footer -->
<div class="footer">
  <button class="btn-text" onclick="killAll()">关闭微信</button>
  <span style="flex:1"></span>
  <button class="btn-text" onclick="startAddAccount()">添加账号</button>
  <button class="btn-login" id="btnLogin" onclick="launchAll()">登录</button>
</div>

<!-- login waiting -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-waiting">
    <div class="login-spinner"></div>
    <h2>等待扫码登录</h2>
    <p>请使用手机微信扫描屏幕上的二维码<br>登录成功后凭证将自动备份</p>
    <button class="btn-cancel" onclick="cancelAddAccount()">取消</button>
  </div>
</div>

<!-- toast -->
<div class="toast-container" id="toastContainer"></div>

<!-- edit name modal -->
<div class="modal-overlay" id="editNameModal">
  <div class="modal">
    <h2>编辑微信名</h2>
    <div><label>微信名</label><input type="text" id="editNameInput" placeholder="输入微信昵称" onkeydown="if(event.key==='Enter')doEditWechatName()"></div>
    <div class="modal-actions">
      <button class="btn-text" onclick="closeModal('editNameModal')">取消</button>
      <button class="btn-login" onclick="doEditWechatName()">确认</button>
    </div>
  </div>
</div>

<!-- delete confirm modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h2>删除账号</h2>
    <p style="font-size:14px;color:var(--text);line-height:1.6;">
      确定删除「<strong id="deleteTargetName"></strong>」？<br>
      <span style="font-size:12px;color:var(--red);">同时会删除对应的凭证备份数据</span>
    </p>
    <div class="modal-actions">
      <button class="btn-text" onclick="closeModal('deleteModal')">取消</button>
      <button class="btn-login" style="background:#1a1a2e;color:#fff;" onclick="doDeleteAccount()">删除</button>
    </div>
  </div>
</div>
<!-- add modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>添加账号</h2>
    <div><label>名称</label><input type="text" id="addName" placeholder="输入账号名称" autofocus></div>
    <div class="modal-actions">
      <button class="btn-text" onclick="closeModal('addModal')">取消</button>
      <button class="btn-login" onclick="doAddAccount()">确认</button>
    </div>
  </div>
</div>

<!-- settings modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" style="width:480px;">
    <h2>设置</h2>
    <div><label>微信程序</label><div class="row"><span class="path-display" id="setExe">-</span><button class="btn-text" onclick="browseFile('exe')">浏览</button></div></div>
    <div><label>数据目录</label><div class="row"><span class="path-display" id="setData">-</span><button class="btn-text" onclick="browseFile('data')">浏览</button></div></div>
    <div><label>存储位置</label><div class="row"><span class="path-display" id="setRoot">-</span><button class="btn-text" onclick="browseFile('root')">浏览</button></div></div>
    <label class="checkbox-row"><input type="checkbox" id="setAuto"> 开机自动启动</label>
    <div class="row"><label style="flex:1">日志级别</label><select id="setLog" style="width:auto"><option>DEBUG</option><option selected>INFO</option><option>WARNING</option><option>ERROR</option></select></div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn-text" onclick="exportLogs()" title="打包日志文件用于远程调试">导出日志</button>
    </div>
    <div class="modal-actions">
      <button class="btn-text" onclick="closeModal('settingsModal')">取消</button>
      <button class="btn-login" onclick="doSaveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
let api = null;
window.addEventListener('pywebviewready', () => {
  api = window.pywebview.api;
  refresh();
  setInterval(refreshStatus, 3000);
});

// ——— titlebar drag ———
let dragInfo = null;
document.addEventListener('mousedown', e => {
  if (e.target.closest('.titlebar') && !e.target.closest('button')) {
    dragInfo = { sx: e.screenX, sy: e.screenY };
  }
});
document.addEventListener('mousemove', () => {
  if (dragInfo && api && api.move_window_by) {
    const dx = event.screenX - dragInfo.sx;
    const dy = event.screenY - dragInfo.sy;
    dragInfo.sx = event.screenX;
    dragInfo.sy = event.screenY;
    api.move_window_by(dx, dy);
  }
});
document.addEventListener('mouseup', () => { dragInfo = null; });

let accounts = [];
let deleteTargetId = null;

// ——— data ———
async function refresh() {
  try { accounts = await api.get_accounts(); render(); } catch(e) {}
}
async function refreshStatus() {
  try {
    const r = await api.refresh_online_status();
    if (r && r.changed) await refresh();
  } catch(e) {}
}

// ——— render ———
function render(filtered) {
  const list = filtered || accounts;
  const c = document.getElementById('accountList');
  if (!list.length) {
    c.innerHTML = '<div class="empty-state"><img class="empty-icon" src="{{CHAT_ICON}}" alt=""><div class="empty-title">暂无账号</div><div class="empty-desc">添加微信账号并备份凭证</div></div>';
    return;
  }
  c.innerHTML = list.map(a => {
    const last = a.last_login_text ? `上次登录 · ${a.last_login_text}` : '从未登录';
    let subtitle, cardClass, clickable;
    if (a.is_online) {
      subtitle = '<span style="color:var(--green)">● 在线</span>';
      cardClass = ' online';
      clickable = '';
    } else if (a.is_launching) {
      subtitle = '<span style="color:var(--orange)">● 等待登录</span>';
      cardClass = ' launching';
      clickable = '';
    } else {
      subtitle = `${last}${a.has_credentials ? '' : '  ·  请先备份凭证'}`;
      cardClass = '';
      clickable = a.has_credentials ? '' : ` onclick="launchAccount('${a.id}')" style="cursor:pointer"`;
    }

    const avatar = a.avatar_base64
      ? `<img src="${a.avatar_base64}" onerror="this.style.display='none';this.nextSibling.style.display='flex'" alt=""><span style="display:none">${esc(a.display_title).charAt(0)}</span>`
      : `<span>${(a.display_title || a.name).charAt(0)}</span>`;

    const dotClass = a.is_online ? ' online' : (a.is_launching ? '' : ' offline');
    const running = a.is_online || a.is_launching;

    return `<div class="card${cardClass}"${clickable}>
      <div class="dot${dotClass}"></div>
      <div class="avatar">${avatar}</div>
      <div class="info">
        <div class="title">${esc(a.display_title)}<span class="edit-hint" onclick="event.stopPropagation();editWechatName('${a.id}')">✎</span></div>
        <div class="sub">${subtitle}</div>
      </div>
      ${running ? `<button class="card-close" onclick="event.stopPropagation();killAccount('${a.id}')">下线</button>` : ''}
      <button class="card-delete" onclick="event.stopPropagation();deleteAccount('${a.id}')" title="删除">
        <img src="{{ICON_DELETE}}" alt="">
      </button>
    </div>`;
  }).join('');

  // 更新登录按钮状态
  const onlineCount = accounts.filter(a => a.is_online).length;
  const btn = document.getElementById('btnLogin');
  if (onlineCount > 0) {
    btn.className = 'btn-login info';
    btn.textContent = `${onlineCount} 个在线`;
  } else {
    btn.className = 'btn-login';
    btn.textContent = '登录';
  }
}


// ——— actions ———
async function launchAccount(id) {
  const r = await api.launch_account(id);
  toast(r.ok, r.msg);
  await refresh();
}
async function deleteAccount(id) {
  const a = accounts.find(x => x.id === id);
  if (!a) return;
  deleteTargetId = id;
  document.getElementById("deleteTargetName").innerText = a.display_title || a.name;
  openModal("deleteModal");
}
async function doDeleteAccount() {
  const id = deleteTargetId;
  closeModal("deleteModal");
  deleteTargetId = null;
  if (!id) return;
  await api.delete_account(id, true);
  toast(true, "已删除");
  await refresh();
}

async function launchAll() {
  const r = await api.launch_all();
  if (!r.ok) { toast(false, r.msg); return; }

  // 显示进度提示
  const el = document.createElement('div');
  el.className = 'toast progress';
  el.id = 'launchProgressToast';
  el.innerHTML = '正在启动 <span id="launchProgressText">0/0</span> 个微信窗口…<div class="progress-bar"><div class="progress-bar-fill" id="launchProgressBar" style="width:0%"></div></div>';
  document.getElementById('toastContainer').appendChild(el);

  // 轮询进度
  const poll = setInterval(async () => {
    const p = await api.get_launch_progress();
    const bar = document.getElementById('launchProgressBar');
    const text = document.getElementById('launchProgressText');
    if (bar && text) {
      const pct = p.total > 0 ? Math.round(p.current / p.total * 100) : 0;
      bar.style.width = pct + '%';
      text.textContent = `${p.current}/${p.total}`;
    }
    if (!p.running) {
      clearInterval(poll);
      setTimeout(() => el.remove(), 2000);
      await refresh();
    }
  }, 500);
}
async function killAccount(id) {
  const r = await api.kill_account(id);
  toast(r.ok, r.msg);
  await refresh();
}
async function killAll() {
  const r = await api.kill_all_wechat();
  toast(r.ok, r.msg);
  await refresh();
}
// ——— 扫码登录流程 ———
let loginPollTimer = null;

async function startAddAccount() {
  const r = await api.start_login_session();
  if (!r.ok) { toast(false, r.msg); return; }
  document.getElementById('loginOverlay').classList.add('active');
  loginPollTimer = setInterval(pollLoginSession, 2000);
}

async function cancelAddAccount() {
  clearInterval(loginPollTimer);
  loginPollTimer = null;
  document.getElementById('loginOverlay').classList.remove('active');
  await api.cancel_login_session();
}

async function pollLoginSession() {
  const r = await api.check_login_session();
  if (r.status === 'waiting') return;
  clearInterval(loginPollTimer);
  loginPollTimer = null;
  document.getElementById('loginOverlay').classList.remove('active');
  if (r.status === 'success') {
    toast(true, `已添加「${r.account.display_title}」`);
    await refresh();
  } else if (r.status === 'cancelled') {
    toast(false, '登录已取消');
  }
}

let editTargetId = null;

function editWechatName(id) {
  editTargetId = id;
  const a = accounts.find(x => x.id === id);
  document.getElementById('editNameInput').value = a.wechat_name || a.wxid_display || '';
  openModal('editNameModal');
  document.getElementById('editNameInput').focus();
  document.getElementById('editNameInput').select();
}

async function doEditWechatName() {
  const v = document.getElementById('editNameInput').value.trim();
  if (v) {
    await api.update_wechat_name(editTargetId, v);
    await refresh();
  }
  closeModal('editNameModal');
}

// ——— settings ———
async function openSettings() {
  const s = await api.get_settings_data();
  document.getElementById('setExe').innerText = s.wechat_exe_path;
  document.getElementById('setData').innerText = s.wechat_data_dir;
  document.getElementById('setRoot').innerText = s.root_data_dir;
  document.getElementById('setAuto').checked = s.auto_start;
  document.getElementById('setLog').value = s.log_level;
  openModal('settingsModal');
}
async function doSaveSettings() {
  const r = await api.save_settings({
    wechat_exe_path: document.getElementById('setExe').innerText,
    wechat_data_dir: document.getElementById('setData').innerText,
    root_data_dir: document.getElementById('setRoot').innerText,
    auto_start: document.getElementById('setAuto').checked,
    log_level: document.getElementById('setLog').value,
  });
  toast(r.ok, r.msg);
  if (r.ok) closeModal('settingsModal');
}
async function browseFile(type) {
  const p = await api.select_file(type === 'exe' ? '选择微信程序' : '选择目录', type === 'exe' ? 'exe' : '');
  if (p) {
    if (type === 'exe') document.getElementById('setExe').innerText = p;
    else if (type === 'data') document.getElementById('setData').innerText = p;
    else document.getElementById('setRoot').innerText = p;
  }
}

async function exportLogs() {
  const r = await api.export_logs();
  toast(r.ok, r.msg);
}

// ——— modal ———
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); }));

// ——— toast ———
function toast(ok, msg) {
  const el = document.createElement('div');
  el.className = `toast ${ok ? 'success' : 'error'}`;
  el.innerText = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function esc(s) { const d = document.createElement('div'); d.innerText = s; return d.innerHTML; }
</script>
